<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
	<title>Calculator</title>
	<rect width="128" height="128" rx="28" fill="#0e1116"/>
	<!-- A calculator: a display, four operators, and the equals key. -->
	<rect x="28" y="22" width="72" height="22" rx="6" fill="#7cc4a0"/>
	<g fill="#e7ebf0">
		<rect x="28" y="54" width="15" height="15" rx="4"/>
		<rect x="50" y="54" width="15" height="15" rx="4"/>
		<rect x="72" y="54" width="15" height="15" rx="4"/>
		<rect x="28" y="78" width="15" height="15" rx="4"/>
		<rect x="50" y="78" width="15" height="15" rx="4"/>
		<rect x="72" y="78" width="15" height="15" rx="4"/>
	</g>
	<rect x="94" y="54" width="15" height="39" rx="4" fill="#7cc4a0"/>
</svg>
